[package]
name = "t-boost-py"
description = "PyO3 bindings for t-boost (builds as a Python extension via maturin; not published to crates.io)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Inherit the normal no-panic/missing-docs lint wall. `unsafe_code = "forbid"`
# is deliberately not in the workspace table, so this PyO3 crate can allow the
# generated binding unsafe locally while still sharing the rest of the gates.
[lints]
workspace = true

[lib]
name       = "_t_boost"          # the compiled module is `t_boost._t_boost` (§02.7)
crate-type = ["cdylib"]

[dependencies]
t-boost-core = { path = "../t-boost-core", version = "0.8.0" }
rayon = { workspace = true }
pyo3  = { workspace = true, features = ["extension-module", "abi3-py310"] }
numpy = { workspace = true }
serde_json = { workspace = true }
