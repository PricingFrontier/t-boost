name: Coverage

# Informational line coverage of the core crate (spec §13.10 targets >= 90% line, >= 95% for
# the math modules). Kept out of ci.yml on purpose: instrumented, the suite runs for over two
# hours, and a timed-out job there would turn main's CI run "cancelled" and block Release.
# It reports (per-file percentages + an lcov artifact) but gates nothing until a baseline
# exists.

on:
  schedule:
    - cron: "43 2 * * *" # nightly, off-peak UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate lcov report (all features)
        run: cargo llvm-cov --release -p t-boost-core --all-features --lcov --output-path lcov.info
      - name: Per-file coverage report
        run: cargo llvm-cov report --release
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
