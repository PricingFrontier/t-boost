name: Release Gate

# The publication gate. This workflow is intentionally heavier
# than Correctness CI: it is the explicit pre-publish checklist for matrix Rust
# gates, wheel/sdist builds, clean-env wheel smoke, the exactness preflight, and the
# crates.io publish dry-run. It never publishes by itself. Accuracy benchmarking
# against other libraries lives in insur-arena, not here.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Deliberately near-identical to ci.yml's `platform-matrix` job: that job runs
  # this same {stable,MSRV}x{4-OS} matrix automatically (push to main + nightly, via
  # pinned "1.96.1" rather than the floating "stable" tag) so a platform regression
  # can't silently accumulate between manual pre-publish runs; this copy stays so
  # the pre-publish checklist remains one self-contained workflow.
  rust-matrix:
    name: rust ${{ matrix.rust }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
        rust: [stable, "1.85.0"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fmt
        if: matrix.rust == 'stable'
        run: cargo fmt --all --check
      - name: Core clippy
        if: matrix.rust == 'stable' # lints differ between clippy versions; the MSRV leg builds and tests only
        run: cargo clippy -p t-boost-core --all-targets --all-features -- -D warnings
      - name: Core tests (all features)
        run: cargo test --release -p t-boost-core --all-features
      - name: Slow core tests
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo test --release -p t-boost-core --all-features --test '*' -- --ignored
      - name: Doctests
        run: cargo test -p t-boost-core --doc
      - name: Determinism and invariant gates
        run: |
          cargo test --release -p t-boost-core --test determinism
          cargo test --release -p t-boost-core --test invariants_gate
      - name: Grep gates
        if: matrix.rust == 'stable'
        run: cargo run -p xtask -- check-all

  # spec §13.4/§11.1's "bit-repro over serve speed" policy (decided 2026-07-11):
  # multiversion/target-cpu dispatch is deliberately deferred until specific
  # (integer-only) kernels are proven order-exact across vector widths. This job is
  # the standing regression canary for that future work — it proves an x86-64-v3
  # build is ALREADY byte-identical to the shipped portable baseline on today's
  # scalar kernels, so adopting the faster baseline later is a verified green flip,
  # not a gamble. Runs the determinism/scoring-determinism suites under each build
  # (proving each is internally thread-count-consistent), then the direct
  # cross-build check: fit the same xtask fixture under each RUSTFLAGS and `cmp`
  # the two encoded outputs. Deliberately near-identical to ci.yml's own
  # `bit-repro-cpu-baseline` job (push-to-main + nightly cadence there); this copy
  # stays so the pre-publish checklist remains one self-contained workflow — same
  # reason release-gate.yml keeps its own `rust-matrix` alongside ci.yml's
  # `platform-matrix`.
  bit-repro-cpu-baseline:
    name: target-cpu=x86-64-v3 vs portable baseline (byte-identical canary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check host CPU supports AVX2 (the x86-64-v3 floor)
        id: cpu-check
        run: |
          if grep -qE '(^|[[:space:]])avx2([[:space:]]|$)' /proc/cpuinfo 2>/dev/null; then
            echo "has_avx2=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_avx2=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Runner CPU lacks AVX2 - skipping the target-cpu=x86-64-v3 canary (skip-with-notice, not a false pass). Re-run on an AVX2 runner to actually exercise this guard."
          fi
      - name: Determinism + scoring-determinism suites (portable baseline)
        if: steps.cpu-check.outputs.has_avx2 == 'true'
        run: |
          cargo test --release -p t-boost-core --test determinism
          cargo test --release -p t-boost-core --test scoring_determinism
      - name: bit-repro fixture (portable baseline)
        if: steps.cpu-check.outputs.has_avx2 == 'true'
        run: cargo run -p xtask -- bit-repro --seed 7 --output target/bit-repro-baseline.bin
      - name: Determinism + scoring-determinism suites (target-cpu=x86-64-v3)
        if: steps.cpu-check.outputs.has_avx2 == 'true'
        env:
          RUSTFLAGS: "-D warnings -C target-cpu=x86-64-v3"
        run: |
          cargo test --release -p t-boost-core --test determinism
          cargo test --release -p t-boost-core --test scoring_determinism
      - name: bit-repro fixture (target-cpu=x86-64-v3)
        if: steps.cpu-check.outputs.has_avx2 == 'true'
        env:
          RUSTFLAGS: "-D warnings -C target-cpu=x86-64-v3"
        run: cargo run -p xtask -- bit-repro --seed 7 --output target/bit-repro-v3.bin
      - name: Byte-compare the two builds' fixture output
        if: steps.cpu-check.outputs.has_avx2 == 'true'
        run: cmp target/bit-repro-baseline.bin target/bit-repro-v3.bin

  supply-chain:
    name: supply chain + publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: crates.io publish dry-run
        run: cargo publish -p t-boost-core --dry-run
      - name: semver check
        run: |
          cargo install cargo-semver-checks --locked
          cargo semver-checks check-release --package t-boost-core

  internal-preflight:
    name: internal M6 preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release preflight artifact
        run: cargo run -p xtask -- release-preflight --seed 7 --output target/release-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-preflight
          path: target/release-preflight.json

  wheels:
    name: wheel ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            artifact: linux-x86_64-manylinux2014
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
            artifact: linux-aarch64-manylinux2014
          - os: ubuntu-latest
            target: x86_64
            manylinux: "musllinux_1_2"
            artifact: linux-x86_64-musllinux_1_2
          - os: macos-15-intel
            target: x86_64
            artifact: macos-x86_64
          - os: macos-14
            target: aarch64
            artifact: macos-aarch64
          - os: windows-latest
            target: x64
            artifact: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux wheel
        if: startsWith(matrix.os, 'ubuntu')
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
      - name: Build native wheel
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Build sdist
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64' && matrix.manylinux == '2014'
        run: python -m pip install "maturin>=1.5,<2.0" && maturin sdist --out dist
      - name: Clean-env wheel smoke
        if: matrix.manylinux != 'musllinux_1_2'
        shell: bash
        run: |
          python -m venv .venv-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            source .venv-smoke/Scripts/activate
          else
            source .venv-smoke/bin/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import numpy as np
          from t_boost.sklearn import TBoostRegressor

          x = np.array([[float(i % 4), float((i // 2) % 3)] for i in range(32)], dtype=np.float32)
          y = np.where(x[:, 0] <= 1.0, 1.0, -0.5).astype(np.float32)
          model = TBoostRegressor(n_trees=6, learning_rate=0.3, max_bin=16, seed=3).fit(x, y)
          pred = model.predict(x)
          assert pred.shape == (x.shape[0],)
          restored = TBoostRegressor.from_bytes(model.to_bytes())
          np.testing.assert_array_equal(pred, restored.predict(x))
          assert model.tables(x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.artifact }}
          path: dist/*
