          - from_json: python-reference/tboostregressor/from_json.md
          - get_params: python-reference/tboostregressor/get_params.md
          - predict_contributions: python-reference/tboostregressor/predict_contributions.md
          - pricing_report: python-reference/tboostregressor/pricing_report.md
          - score: python-reference/tboostregressor/score.md
